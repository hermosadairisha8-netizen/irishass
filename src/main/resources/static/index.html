<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Irisha - Scientific Calculator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{background:linear-gradient(135deg,#dbeafe 0%,#bfdbfe 50%,#93c5fd 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px}
.calculator{background:rgba(255,255,255,0.92);width:100%;max-width:380px;border-radius:24px;padding:18px;box-shadow:0 8px 28px rgba(37,99,235,0.18);border:2px solid #bfdbfe;backdrop-filter:blur(12px)}
h1{text-align:center;background:linear-gradient(135deg,#1d4ed8,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-size:22px;font-weight:900;margin-bottom:6px;letter-spacing:0.5px}
h1 span{font-size:18px}
.subtitle{text-align:center;color:#60a5fa;font-size:11px;margin-bottom:14px}
.display{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid #93c5fd;border-radius:16px;padding:14px;text-align:right;min-height:90px;margin-bottom:12px;box-shadow:inset 0 2px 8px rgba(37,99,235,0.08)}
#expr{color:#2563eb;font-size:13px;min-height:18px;word-break:break-all;opacity:0.9}
#curr{color:#1e3a8a;font-size:32px;font-weight:800;word-break:break-all}
.sci-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px}
.std-row{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
button{height:52px;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.12s ease;box-shadow:0 2px 0 rgba(0,0,0,0.08)}
button:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,0.08)}
.sci{background:#dbeafe;color:#1e40af;font-size:13px;border:1px solid #bfdbfe}
.sci:hover{background:#bfdbfe}
.func{background:#bfdbfe;color:#1e40af}
.num{background:white;color:#1e3a8a;border:1px solid #dbeafe;font-size:18px}
.op{background:linear-gradient(135deg,#2563eb,#3b82f6);color:white;box-shadow:0 3px 0 #1d4ed8;font-size:18px}
.eq{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:white;box-shadow:0 3px 0 #1e3a8a;font-size:20px}
.zero{grid-column:span 2}
</style>
</head>
<body>
<div class="calculator">
<h1><span>💙</span> Irisha <span>✨</span></h1>
<div class="subtitle">Scientific Calculator - Blue</div>
<div class="display"><div id="expr"></div><div id="curr">0</div></div>
<div class="sci-row">
<button class="sci" onclick="sciFunc('sin')">sin</button>
<button class="sci" onclick="sciFunc('cos')">cos</button>
<button class="sci" onclick="sciFunc('tan')">tan</button>
<button class="sci" onclick="sciFunc('log')">log</button>
<button class="sci" onclick="sciFunc('ln')">ln</button>
</div>
<div class="sci-row">
<button class="sci" onclick="input('(')">(</button>
<button class="sci" onclick="input(')')">)</button>
<button class="sci" onclick="sciFunc('pow')">x^y</button>
<button class="sci" onclick="sciFunc('sqrt')">√</button>
<button class="sci" onclick="sciFunc('fact')">!</button>
</div>
<div class="sci-row">
<button class="sci" onclick="inputConst('π')">π</button>
<button class="sci" onclick="inputConst('e')">e</button>
<button class="sci" onclick="sciFunc('exp')">EXP</button>
<button class="sci" onclick="sciFunc('sq')">x²</button>
<button class="sci" onclick="input('%')">%</button>
</div>
<div class="std-row">
<button class="func" onclick="clearAll()">C</button>
<button class="func" onclick="toggleSign()">+/-</button>
<button class="func" onclick="backspace()">⌫</button>
<button class="op" onclick="input('/')">÷</button>
<button class="num" onclick="input('7')">7</button>
<button class="num" onclick="input('8')">8</button>
<button class="num" onclick="input('9')">9</button>
<button class="op" onclick="input('*')">×</button>
<button class="num" onclick="input('4')">4</button>
<button class="num" onclick="input('5')">5</button>
<button class="num" onclick="input('6')">6</button>
<button class="op" onclick="input('-')">−</button>
<button class="num" onclick="input('1')">1</button>
<button class="num" onclick="input('2')">2</button>
<button class="num" onclick="input('3')">3</button>
<button class="op" onclick="input('+')">+</button>
<button class="num zero" onclick="input('0')">0</button>
<button class="num" onclick="input('.')">.</button>
<button class="eq" onclick="calculate()">=</button>
</div>
</div>
<script>
let expr='', display='0';
const exprEl=document.getElementById('expr'), currEl=document.getElementById('curr');
function update(){exprEl.textContent=expr; currEl.textContent=display}
function input(v){
  if(display==='0' && v!=='.' && !isNaN(v)) {display=v;}
  else {display+=v;}
  expr+=v;
  update();
}
function inputConst(c){
  let val = c==='π'? Math.PI.toString() : Math.E.toString();
  display=val; expr+=c;
  update();
}
function clearAll(){expr=''; display='0'; update();}
function toggleSign(){ if(display.startsWith('-')) {display=display.slice(1);} else {display='-'+display;} expr=display; update();}
function backspace(){ if(expr.length>0){expr=expr.slice(0,-1); display=display.slice(0,-1)||'0'; update();}}
function sciFunc(fn){
  try{
    let val = parseFloat(display)||0;
    let res=0;
    switch(fn){
      case 'sin': res=Math.sin(val*Math.PI/180); break;
      case 'cos': res=Math.cos(val*Math.PI/180); break;
      case 'tan': res=Math.tan(val*Math.PI/180); break;
      case 'log': res=Math.log10(val); break;
      case 'ln': res=Math.log(val); break;
      case 'sqrt': res=Math.sqrt(val); break;
      case 'sq': res=val*val; break;
      case 'fact': 
        if(val<0||!Number.isInteger(val)) throw 'Error';
        res=1; for(let i=2;i<=val;i++) res*=i; 
        break;
      case 'exp': res=Math.exp(val); break;
      case 'pow': input('^'); return;
    }
    display=Number.isInteger(res)?res.toString():parseFloat(res.toFixed(8)).toString();
    expr=display;
    update();
  }catch(e){display='Error'; expr=''; update();}
}
function calculate(){
  try{
    let e = expr.replace(/π/g, Math.PI.toString()).replace(/e/g, Math.E.toString()).replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/\^/g,'**');
    e = e.replace(/%/g,'/100');
    let res = Function('"use strict"; return ('+e+')')();
    if(!isFinite(res)) throw 'Error';
    display=Number.isInteger(res)?res.toString():parseFloat(res.toFixed(10)).toString();
    expr=display;
    update();
  }catch(err){
    display='Error'; expr=''; update();
  }
}
update();
</script>
</body>
</html>
