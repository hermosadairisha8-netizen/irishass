!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Irisha - Calculator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{background:linear-gradient(135deg,#f5f3ff 0%,#fce7f3 50%,#e9d5ff 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;position:relative;overflow:hidden}
body::before{content:'💜';position:absolute;top:8%;left:12%;font-size:36px;opacity:0.4;animation:float1 5s ease-in-out infinite}
body::after{content:'✨';position:absolute;bottom:10%;right:14%;font-size:32px;opacity:0.4;animation:float2 6s ease-in-out infinite}
.calculator{background:rgba(255,255,255,0.9);width:100%;max-width:340px;border-radius:24px;padding:22px;box-shadow:0 8px 24px rgba(168,85,247,0.15);border:2px solid #e9d5ff;position:relative;z-index:2;backdrop-filter:blur(12px)}
h1{text-align:center;background:linear-gradient(135deg,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-size:22px;font-weight:900;margin-bottom:18px;letter-spacing:0.5px}
h1 span{font-size:18px}
.display{background:linear-gradient(135deg,#faf5ff,#fdf2f8);border:2px solid #e9d5ff;border-radius:16px;padding:18px;text-align:right;min-height:80px;margin-bottom:16px;box-shadow:inset 0 2px 8px rgba(168,85,247,0.08)}
#prev{color:#a855f7;font-size:13px;min-height:16px;word-break:break-all}
#curr{color:#6b21a8;font-size:36px;font-weight:800;word-break:break-all}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
button{height:60px;border:none;border-radius:16px;font-size:19px;font-weight:700;cursor:pointer;transition:all 0.15s ease;box-shadow:0 3px 0 rgba(0,0,0,0.08)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,0.08)}
.num{background:white;color:#6b21a8;border:2px solid #f5f3ff}
.op{background:linear-gradient(135deg,#a855f7,#ec4899);color:white;box-shadow:0 3px 0 #9333ea}
.func{background:#e9d5ff;color:#7e22ce;box-shadow:0 3px 0 #d8b4fe}
.eq{background:linear-gradient(135deg,#9333ea,#ec4899);color:white;box-shadow:0 3px 0 #7e22ce}
@keyframes float1{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</head>
<body>
<div class="calculator">
<h1><span>💜</span> Irisha <span>✨</span></h1>
<div class="display"><div id="prev"></div><div id="curr">0</div></div>
<div class="buttons">
<button class="func" onclick="clearAll()">C</button>
<button class="func" onclick="toggleSign()">+/-</button>
<button class="func" onclick="percent()">%</button>
<button class="op" onclick="inputOp('/')">÷</button>
<button class="num" onclick="inputNum('7')">7</button>
<button class="num" onclick="inputNum('8')">8</button>
<button class="num" onclick="inputNum('9')">9</button>
<button class="op" onclick="inputOp('*')">×</button>
<button class="num" onclick="inputNum('4')">4</button>
<button class="num" onclick="inputNum('5')">5</button>
<button class="num" onclick="inputNum('6')">6</button>
<button class="op" onclick="inputOp('-')">−</button>
<button class="num" onclick="inputNum('1')">1</button>
<button class="num" onclick="inputNum('2')">2</button>
<button class="num" onclick="inputNum('3')">3</button>
<button class="op" onclick="inputOp('+')">+</button>
<button class="num" style="grid-column:span 2" onclick="inputNum('0')">0</button>
<button class="num" onclick="inputNum('.')">.</button>
<button class="eq" onclick="calculate()">=</button>
</div>
</div>
<script>
let curr='0',prev='',op=null,reset=false;
const currEl=document.getElementById('curr'),prevEl=document.getElementById('prev');
function update(){currEl.textContent=curr;prevEl.textContent=prev}
function inputNum(n){if(reset){curr=n==='.'?'0.':n;reset=false}else{if(n==='.'&&curr.includes('.'))return;if(curr==='0'&&n!=='.')curr=n;else curr+=n;}update()}
function inputOp(o){if(op&&!reset)calculate();prev=curr+' '+o;op=o;reset=true;update()}
function calculate(){if(!op||reset)return;let a=parseFloat(prev),b=parseFloat(curr),r=0;switch(op){case '+':r=a+b;break;case '-':r=a-b;break;case '*':r=a*b;break;case '/':if(b===0){curr="Can't ÷ by 0 💔";prev='';op=null;update();return}r=a/b;break;case '%':r=a%b;break}curr=Number.isInteger(r)?r.toString():parseFloat(r.toFixed(8)).toString();prev='';op=null;reset=true;update()}
function clearAll(){curr='0';prev='';op=null;update()}
function toggleSign(){if(curr==='0')return;curr=curr.startsWith('-')?curr.slice(1):'-'+curr;update()}
function percent(){curr=(parseFloat(curr)/100).toString();update()}
</script>
</body>
</html>
